<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Category — Star Electric Enterprises | Saddar, Rawalpindi</title>
<meta name="description" content="Browse an electrical product category at Star Electric Enterprises, Saddar, Rawalpindi. Subcategories, filters, sorting and the full product range for the department.">
<link rel="canonical" href="https://REPLACE-WITH-DOMAIN/category.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Product Category — Star Electric Enterprises">
<meta property="og:description" content="Browse an electrical product category with subcategories, filters and sorting.">
<meta property="og:image" content="assets/logo/star-electric-logo-stacked.jpg">
<meta property="og:url" content="https://REPLACE-WITH-DOMAIN/category.html">
<link rel="icon" href="assets/logo/favicon.png" sizes="any">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="category">

<a class="skip-link" href="#main">Skip to main content</a>

<div id="siteHeader"></div>
<div class="drawer" id="mobileNav" hidden></div>

<main id="main">

  <!-- CATEGORY TEMPLATE → taxonomy-product_cat.php
       Reads ?cat=[slug] and optional &amp;sub=[slug] — one template serves
       every category and subcategory. -->
  <div class="page-head">
    <div class="container" id="breadcrumb"></div>
  </div>

  <section class="section section--sm">
    <div class="container">

      <div class="cat-hero">
        <div>
          <p class="section__eyebrow">Department</p>
          <h1 class="section__title" id="catTitle">Category</h1>
          <p class="section__sub" id="catBlurb"></p>
          <div class="btn-row" style="margin-top:20px">
            <a class="btn btn--accent btn--sm" href="quote-request.html">Request a Quote</a>
            <a class="btn btn--ghost btn--sm" href="shop.html">All departments</a>
          </div>
        </div>
        <div class="cat-hero__art">
          <img id="catArt" src="assets/images/categories/wiring-accessories.webp" alt=""
               width="900" height="560" loading="lazy" decoding="async">
        </div>
      </div>

      <h2 class="section__title" style="font-size:19px;margin-bottom:16px">Browse subcategories</h2>
      <ul class="subcat-grid" id="subcatGrid" style="margin-bottom:40px"></ul>

      <div class="shop-layout">
        <aside class="filters" data-filters aria-label="Product filters"></aside>

        <div>
          <div class="shop-toolbar">
            <div class="shop-toolbar__left">
              <button class="btn btn--ghost btn--sm filter-open" type="button" id="filterOpen">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                <span>Filters</span>
              </button>
              <span id="resultCount">Loading products…</span>
            </div>
            <div class="shop-toolbar__right">
              <label class="sr-only" for="sortSelect">Sort products</label>
              <select class="select" id="sortSelect">
                <option value="relevance">Sort: Featured</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
                <option value="rating">Rating</option>
                <option value="discount">Biggest Discount</option>
              </select>
              <div class="view-toggle" role="group" aria-label="Product view">
                <button type="button" data-view="grid" aria-pressed="true" aria-label="Grid view">
                  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
                </button>
                <button type="button" data-view="list" aria-pressed="false" aria-label="List view">
                  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="chips" id="activeChips" style="margin-bottom:16px"></div>

          <ul class="product-grid" id="catalogGrid"></ul>

          <div id="catalogEmpty" hidden>
            <div class="empty-state">
              <span class="empty-state__ico">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.2v9.6L12 21l-8-4.2V7.2Z"/><path d="m4 7.2 8 4.3 8-4.3M12 21v-9.5"/></svg>
              </span>
              <h2>Nothing in this selection yet</h2>
              <p>No demo products match the current filters for this category.</p>
              <button class="btn btn--accent" type="button" data-clear-all>Clear all filters</button>
            </div>
          </div>

          <nav class="pagination" id="pagination" aria-label="Product pages" style="margin-top:32px"></nav>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="siteFooter"></div>

<div class="drawer drawer--right" id="filterDrawer" hidden>
  <div class="drawer__scrim" data-side-close></div>
  <div class="drawer__panel" role="dialog" aria-modal="true" aria-label="Product filters">
    <div class="drawer__head">
      <span class="drawer__title">Filters</span>
      <button class="icon-btn" type="button" data-side-close aria-label="Close filters">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer__body" data-filters></div>
    <div class="drawer__foot">
      <button class="btn btn--accent btn--block" type="button" data-side-close>Show results</button>
    </div>
  </div>
</div>

<div class="modal" id="quickView" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="qvTitle">
    <button class="icon-btn modal__close" type="button" data-close aria-label="Close quick view">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <div id="qvBody"></div>
  </div>
</div>

<button class="to-top" id="toTop" type="button" aria-label="Back to top" hidden>
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
</button>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
</body>
</html>
